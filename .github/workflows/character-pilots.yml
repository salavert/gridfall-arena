name: Character pilots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/character-pilots.yml'
      - 'scripts/build-character-pilots.py'
      - 'src/characters/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-pilots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri libglx-mesa0 xvfb

      - name: Fetch pinned CC0 pilot sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .character-source

          UBC_BASE='https://raw.githubusercontent.com/dustinc555/mygame/6f12ffb2f924af86d910ade13e6e2ba3df8cd3df/assets/vendor/quaternius/universal_base_characters/base_characters'
          ASSET_BASE='https://raw.githubusercontent.com/Dallolz/moorfall-assets/main'

          fetch() {
            curl --fail --location --retry 3 --silent --show-error "$1" --output ".character-source/$2"
          }

          for stem in Teen_Female_FullBody Teen_Male_FullBody; do
            fetch "$UBC_BASE/$stem.gltf" "$stem.gltf"
            fetch "$UBC_BASE/$stem.bin" "$stem.bin"
          done

          for file in             T_Eye_Brown.png             T_Eye_Normal_png.png             T_Hair_1_BaseColor_png.png             T_Hair_1_Normal.png             T_Hair_2_BaseColor_png.png             T_Hair_2_Normal.png             T_Teen_Female_Dark_BaseColor_png.png             T_Teen_Female_Normal.png             T_Teen_Female_Roughness_png.png             T_Teen_Male_Dark_BaseColor.png             T_Teen_Male_Normal.png             T_Teen_Male_Roughness.png; do
            fetch "$UBC_BASE/$file" "$file"
          done

          fetch "$ASSET_BASE/outfits/Female_Peasant.glb" Female_Peasant.glb
          fetch "$ASSET_BASE/outfits/Male_Peasant.glb" Male_Peasant.glb
          fetch "$ASSET_BASE/hair/Hair_Long.glb" Hair_Long.glb
          fetch "$ASSET_BASE/hair/Hair_SimpleParted.glb" Hair_SimpleParted.glb
          fetch "$ASSET_BASE/animations/UAL1.glb" UAL1.glb

      - name: Build pilot characters
        run: |
          xvfb-run -a blender --background --python-exit-code 1 --python scripts/build-character-pilots.py -- --source-dir .character-source --output-dir artifacts/character-pilots

      - name: Inspect generated GLBs
        run: |
          npm run character:inspect -- artifacts/character-pilots/carla-pilot.glb --verify-ubc
          npm run character:inspect -- artifacts/character-pilots/bruno-pilot.glb --verify-ubc

      - name: Upload pilot assets
        uses: actions/upload-artifact@v4
        with:
          name: character-pilots
          path: artifacts/character-pilots/
          if-no-files-found: error
          retention-days: 7
